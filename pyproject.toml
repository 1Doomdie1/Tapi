[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tapi"
version = "3.0.0"
description = "Unofficial Python wrapper for the Tines REST API."
readme = "README.md"
license = "GPL-3.0"
license-files = ["LICENSE"]
authors = [{ name = "1Doomdie1" }]
requires-python = ">=3.11"
keywords = ["tines", "api", "rest", "sdk", "wrapper", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
]

[project.urls]
Homepage = "https://github.com/1Doomdie1/Tapi"
Documentation = "https://github.com/1Doomdie1/Tapi/blob/main/docs/README.md"
Repository = "https://github.com/1Doomdie1/Tapi"
Issues = "https://github.com/1Doomdie1/Tapi/issues"
Changelog = "https://github.com/1Doomdie1/Tapi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tapi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/tools",
    "/docs",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/requirements.txt",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PT", "RUF", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: runs against a dedicated Tines test tenant and is left out of the default run",
    "writes: creates, changes or deletes objects on the test tenant",
]
